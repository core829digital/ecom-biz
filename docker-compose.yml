# Production-like stack: PostgreSQL + one-off migrations/seed + the app.
#   cp .env.example .env   # then fill in real values
#   docker compose up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: commerce
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-commerce}
      POSTGRES_DB: commerce
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commerce"]
      interval: 5s
      retries: 10

  migrate:
    build: { context: ., target: migrate }
    env_file: .env
    environment:
      DATABASE_URL: postgresql://commerce:${POSTGRES_PASSWORD:-commerce}@db:5432/commerce?schema=public
    depends_on:
      db: { condition: service_healthy }
    restart: "no"

  app:
    build: { context: ., target: runner }
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://commerce:${POSTGRES_PASSWORD:-commerce}@db:5432/commerce?schema=public
      STORAGE_DIR: /app/storage
    ports:
      - "3000:3000"
    volumes:
      - uploads:/app/storage
    depends_on:
      migrate: { condition: service_completed_successfully }

volumes:
  pgdata:
  uploads:
