name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: commerce
          POSTGRES_PASSWORD: commerce
          POSTGRES_DB: commerce
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U commerce" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://commerce:commerce@localhost:5432/commerce?schema=public
      APP_URL: http://localhost:3000
      STOREFRONT_ROOT_DOMAIN: localhost:3000
      STOREFRONT_PROTOCOL: http
      APP_SECRET: ci-only-secret-0123456789abcdef0123456789abcdef
      STORAGE_DIR: ./storage
      SEED_DEMO: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run db:seed
      - run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        run: |
          npm start > server.log 2>&1 &
          npx --yes wait-on@8 -t 60000 http://localhost:3000/api/health
          npm run test:e2e
      - if: failure()
        run: tail -n 200 server.log
